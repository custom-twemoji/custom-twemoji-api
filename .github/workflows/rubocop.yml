name: Rubocop

on:
  push:
    paths:
      - 'app/**'
      - 'spec/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'spec/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        # '3.4' floats to the latest patch release available on the runner image
        ruby-version: '3.4'
    - name: Install dependencies
      run: bundle install
    - name: Run Rubocop
      run: bundle exec rubocop
