name: Google Cloud

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Add origin secret to deploy config
        env:
          CLOUDFLARE_ORIGIN_SECRET: ${{ secrets.CLOUDFLARE_ORIGIN_SECRET }}
        run: |
          cp app.yaml app.secret.yaml
          printf 'env_variables:\n  CLOUDFLARE_ORIGIN_SECRET: "%s"\n' "$CLOUDFLARE_ORIGIN_SECRET" >> app.secret.yaml
      - name: Deploy to App Engine
        run: gcloud app deploy app.secret.yaml --quiet
      - name: Delete old versions in App Engine
        run: |
          INSTANCE_TYPE="default"
          VERSIONS_TO_KEEP=1
          VERSIONS=`gcloud app versions list --service $INSTANCE_TYPE --sort-by '~version' --format 'value(version.id)' | sort -r | tail -n +$(($VERSIONS_TO_KEEP + 1)) | paste -sd " " -`
          if [ ${#VERSIONS} -gt 0 ]; then
            delete_cmd="gcloud app versions delete --service $INSTANCE_TYPE $VERSIONS -q" && eval $delete_cmd;
          fi
